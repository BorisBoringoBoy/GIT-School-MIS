<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big_Bros_Login_Page</title>
  
  <!-- All Links -->
    <link rel="stylesheet" href="./login.css">
    <script src="./login.js" defer></script>
    <link rel="icon" href="./all images/Big-Bros-Logo-removebg-preview.png">

    <!-- external links -->
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
      <script src="https://kit.fontawesome.com/4fe944c68b.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Menu Icon -->
  <div class="menuIcon">
    <a href="#">
      <i class="fa-solid fa-bars"></i>
    </a>
  </div>
  <!-- end -->

  <!-- Loginsection -->
  <div class="loginSection">
    <h3>Enter your information</h3>
    <!-- login part -->
    <form id="userForm">
      <!-- User Name -->
      <div class="loginPart">
        <label for="userName">Enter your name:</label> 
        <input type="text" placeholder="e.g. Kwizera David" id="userName" class="userName" required>
      </div>
      <!-- end User Name -->

      <!-- User telephone -->
      <div class="loginPart">
        <label for="userTelephone">Enter your number:</label>
        <input type="tel" placeholder="e.g. 0791894325" id="userTelephone" class="userTelephone" required>
      </div>
      <!-- end telephone -->

      <!-- email -->
      <div class="loginPart">
        <label for="userEmail">Enter your email:</label>
        <input type="email" placeholder="e.g. kwizeradavid@gmail.com" id="userEmail" class="userEmail" required>
      </div>
      <!-- end email -->

      <!-- Submit & Reset btn -->
      
      <input type="submit" class="submitBtn">
      <input type="reset" class="resetBtn">
      <!-- end Submit & Reset btn -->
    </form>
    <!-- end login part -->
    
  </div>
  <!-- end Loginsection -->
  
</body>

</html>
